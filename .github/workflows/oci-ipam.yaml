name: OCI VNIC IPAM

on:
  pull_request:
    paths:
      - ".github/workflows/oci-ipam.yaml"
      - "daemon/infraendpoints/**"
      - "install/kubernetes/cilium/**"
      - "operator/**"
      - "pkg/ipam/**"
      - "pkg/k8s/apis/cilium.io/**"
      - "pkg/nodediscovery/**"
      - "pkg/oci/**"
      - "plugins/cilium-cni/**"
  push:
    branches:
      - "oci-v1.19"
  workflow_dispatch: {}

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  unit-and-build:
    name: Unit tests and operator build
    runs-on: ubuntu-24.04
    steps:
      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # renovate: datasource=golang-version depName=go
          go-version: 1.25.12
          cache: false
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Test OCI provider
        run: |
          go test ./pkg/oci/...
          go test -tags ipam_provider_oci \
            ./operator/cmd \
            ./pkg/ipam \
            ./pkg/ipam/allocator/oci \
            ./pkg/nodediscovery \
            ./plugins/cilium-cni/cmd
      - name: Build OCI operator
        run: go build -tags ipam_provider_oci -o /tmp/cilium-operator-oci ./operator
      - name: Check generated API and CRD state
        run: |
          TMPDIR="$(mktemp -d)"
          contrib/scripts/k8s-code-gen.sh "$TMPDIR"
          go tool sigs.k8s.io/controller-tools/cmd/controller-gen \
            crd:crdVersions=v1 \
            paths="./pkg/k8s/apis/cilium.io/v2;./pkg/k8s/apis/cilium.io/v2alpha1" \
            output:crd:artifacts:config="$TMPDIR/crds"
          diff pkg/k8s/apis/cilium.io/client/crds/v2/ciliumnodes.yaml \
            "$TMPDIR/crds/cilium.io_ciliumnodes.yaml"
          test -z "$(git status --porcelain)" ||
            (echo "generated Go API files are out of date"; git status --short; exit 1)
